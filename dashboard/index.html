<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNC Filo Telemetrisi</title>
<!-- Favicon: Alen Otomat'in kendi "A" + altigen somun isareti (bkz. dashboard/icon-*.png). -->
<link rel="icon" type="image/png" href="/icon-192.png">
<!-- Tablette "Ana ekrana ekle": adres cubugu olmadan, kendi penceresinde acilir (bkz. CLAUDE.md "Tablet dagitimi"). -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#6C53E8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CNC Telemetri">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="eyebrow" id="eyebrow">CNC-TLM-001 · Canlı Telemetri</span>
        <h1 id="view-title">Filo Genel Bakış</h1>
      </div>
      <div class="topbar-right">
        <div class="conn" id="conn">
          <span class="conn-dot" aria-hidden="true"></span>
          <span id="conn-text">bağlanıyor…</span>
        </div>
        <button class="icon-btn" id="apps-btn" type="button" hidden title="Telemetri ve Planlama arasında geç">Uygulamalar</button>
        <button class="user-chip" id="user-chip" type="button" hidden></button>
        <button class="icon-btn" id="logout-btn" type="button" hidden>Çıkış</button>
        <button class="icon-btn" id="theme-toggle" type="button">Tema</button>
      </div>
    </header>

    <div class="layout">
      <!-- Tezgah secici: her iki gorunumde de goruntude kalir -->
      <nav class="sidebar" id="sidebar" aria-label="Tezgah seçimi">
        <button class="mi mi-fleet" id="fleet-btn" type="button">
          <span class="mi-dot st-none" aria-hidden="true"><i></i></span>
          <span class="mi-main">
            <span class="mi-name">Filo geneli</span>
            <span class="mi-sub">tüm tezgahlar</span>
          </span>
        </button>
        <p class="sidebar-label">Tezgahlar</p>
        <ul class="machine-list" id="machine-list"></ul>
        <button class="mi mi-production" id="production-btn" type="button">
          <span class="mi-dot st-none" aria-hidden="true"></span>
          <span class="mi-main">
            <span class="mi-name">Üretim raporu</span>
            <span class="mi-sub">vardiya adetleri</span>
          </span>
        </button>
        <button class="mi mi-library" id="library-btn" type="button">
          <span class="mi-dot st-none" aria-hidden="true"></span>
          <span class="mi-main">
            <span class="mi-name">Program kütüphanesi</span>
            <span class="mi-sub">programlar ve aktarım</span>
          </span>
        </button>
        <button class="mi mi-config" id="config-btn" type="button">
          <span class="mi-dot st-none" aria-hidden="true"></span>
          <span class="mi-main">
            <span class="mi-name">Ayarlar</span>
            <span class="mi-sub">tezgah ve sürücü</span>
          </span>
        </button>
      </nav>

      <!-- Planlama uygulamasinin yan menusu (Telemetri'nin tezgah listesi yerine); app.js doldurur -->
      <nav class="sidebar" id="plan-sidebar" aria-label="Planlama bölümleri" hidden></nav>

      <main class="content">
        <section id="apps-view" class="apps-view" aria-live="polite" hidden></section>
        <section id="fleet-view">
          <div class="kpis" id="kpis" aria-label="Filo özeti"></div>
          <div class="fleet-grid" id="fleet-grid"></div>
        </section>

        <section class="detail" id="detail" aria-live="polite" hidden></section>
        <section class="detail" id="config-view" hidden></section>
        <section class="detail" id="library-view" hidden></section>
        <section class="detail" id="production-view" hidden></section>
        <section class="detail" id="planning-view" hidden></section>
      </main>
    </div>

    <footer class="footnote">
      <span id="foot-stats">—</span>
    </footer>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
